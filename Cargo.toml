[package]
name = "dynamic-route-actix"
version = "0.1.0"
edition = "2021"
description = "A dynamic routing library for Actix-Web"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/dynamic-route-actix"
keywords = ["actix", "routing", "dynamic", "web"]
categories = ["web-programming", "asynchronous"]

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"