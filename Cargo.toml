[package]
name = "staticwallpaper"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7.9", features = ["multipart"] }
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "compression-br", "compression-gzip", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
argon2 = "0.5"
rand = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"

# HTTP client for image download
reqwest = { version = "0.11", features = ["stream"] }

# Embed files
rust-embed = { version = "8.0", features = ["include-exclude"] }
mime_guess = "2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true