[package]
name = "rustblog"
version = "3.0.1"
edition = "2024"
license = "MIT"
authors = ["swordreforge <zhujian_20060818@qq.com>"]

[dependencies]
actix-web = { version = "4.12.1", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies"] }
actix-files = { version = "0.6.9", default-features = false }
actix-multipart = { version = "0.7.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
simd-json = { version = "0.17", default-features = false, features = ["serde_impl"], optional = true }
lazy_static = { version = "1.5", default-features = false }
md-5 = { version = "0.10", default-features = false, features = ["std"] }
tokio = { version = "1.49", default-features = false, features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "macros"] }
tera = { version = "1.20", default-features = false, features = ["builtins"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["async-await-macro"] }

# SQLite 数据库
rusqlite = { version = "0.32", default-features = false, features = ["bundled", "chrono", "serde_json"] }
r2d2 = { version = "0.8", default-features = false }
r2d2_sqlite = { version = "0.25", default-features = false }

# 密码哈希
argon2 = { version = "0.5", default-features = false, features = ["password-hash", "alloc"] }
rand = { version = "0.8", default-features = false, features = ["std_rng"] }

# ECC 加密
p256 = { version = "0.13", default-features = false, features = ["ecdh", "pkcs8", "ecdsa", "std"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["ecdh", "std"] }
ecdsa = { version = "0.16", default-features = false, features = ["signing", "std", "digest"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
spki = { version = "0.7", default-features = false }

# Markdown 解析
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# 文件上传
mime_guess = { version = "2.0", default-features = false }

# URL 解码
urlencoding = { version = "2.1", default-features = false }

# 正则表达式
regex = { version = "1.11", default-features = false, features = ["std", "perf"] }

# 异步 trait
async-trait = { version = "0.1", default-features = false }

# 音频元数据提取
id3 = { version = "0.6", default-features = false }
metaflac = { version = "0.2", default-features = false }

# Diff 算法（用于版本差异对比）
similar = { version = "2.6", default-features = false, features = ["text", "inline"] }



# 命令行参数解析
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "color"] }

# 配置文件解析
toml = { version = "0.8", default-features = false, features = ["parse"] }

# GeoIP 数据库查询
maxminddb = { version = "0.27.1", default-features = false }
memmap2 = { version = "0.9", default-features = false }

# 静态变量
once_cell = { version = "1.21", default-features = false, features = ["std", "alloc"] }

# 文件嵌入
rust-embed = { version = "8.11", default-features = false, features = ["include-exclude"] }

# 中文文本摘要库（本地路径）
rustblog-wip-for-summarize-in-zh-cn = { path = "./summarize-in-zh-cn" }

# JWT 认证
jsonwebtoken = { version = "10.3", default-features = false, features = ["use_pem", "rust_crypto"] }

# Valkey/Redis 缓存（可选）
redis = { version = "0.28", default-features = false, features = ["tokio-comp", "connection-manager", "aio"], optional = true }

# 动态路由管理
dynamic-route-actix = { path = "./dynamic-router", default-features = false, features = [] }

# 本地缓存（降级方案）
dashmap = { version = "6.1", default-features = false }
moka = { version = "0.12", default-features = false, features = ["sync"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
glob = { version = "0.3", default-features = false }

# 小数组优化
smallvec = { version = "1.13", default-features = false }

# 结构化日志
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
tracing-appender = { version = "0.2", default-features = false }

# 性能分析
pprof = { version = "0.14", default-features = false, features = ["flamegraph", "criterion", "protobuf-codec"], optional = true }
parking_lot = { version = "0.12.5", default-features = false }

# 内存管理器
tikv-jemallocator = { version = "0.6", default-features = false, features = ["unprefixed_malloc_on_supported_platforms"], optional = true }
mimalloc = { version = "0.1", default-features = false, features = ["override"], optional = true }
tcmalloc = { version = "0.3", default-features = false, optional = true }

# Panic 检测：编译时验证函数不会 panic
no-panic = { version = "0.1", default-features = false }

[features]
default = []
valkey = ["redis"]
profiling = ["pprof"]
simd = ["simd-json"]
jemalloc = ["tikv-jemallocator"]
mimalloc-alloc = ["mimalloc"]
tcmalloc-alloc = ["tcmalloc"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
strip = true
debug-assertions = false
incremental = false

[profile.release.build-override]
opt-level = "z"
codegen-units = 1
strip = true

# 加密和数据库库保留 overflow-checks 以确保安全性
[profile.release.package.p256]
opt-level = "z"
codegen-units = 1
overflow-checks = true
debug = false
strip = true
[profile.release.package.ecdsa]
opt-level = "z"
codegen-units = 1
overflow-checks = true
debug = false
strip = true
[profile.release.package.elliptic-curve]
opt-level = "z"
codegen-units = 1
overflow-checks = true
debug = false
strip = true

[profile.release.package.aes-gcm]
opt-level = "z"
codegen-units = 1
overflow-checks = true
debug = false
strip = true

[profile.release.package.argon2]
opt-level = "z"
codegen-units = 1
overflow-checks = true
debug = false
strip = true

[profile.release.package.sha2]
opt-level = "z"
codegen-units = 1
overflow-checks = true
debug = false
strip = true

[profile.release.package.rusqlite]
opt-level = "z"
codegen-units = 1
overflow-checks = true
debug = false
strip = true
# 其他第三方库使用极致压缩（禁用 overflow-checks）
[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
strip = true
debug = false
debug-assertions = false
overflow-checks = false

[dev-dependencies]
tempfile = "3.13"

[profile.dev]
opt-level = 1      # 启用优化以支持 no-panic 检测
panic = "unwind"   # 启用 no-panic 检测（dev 模式）

