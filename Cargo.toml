[package]
name = "staticwallpaper"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7.9", features = ["multipart"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "fs", "process", "signal"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
argon2 = "0.5"
rand = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
num_cpus = "1.16"
image = "0.25"
zenwebp = "0.3"
sha2 = "0.10"
futures-util = "0.3"

# Embed files
rust-embed = { version = "8.0", features = ["include-exclude"] }
mime_guess = "2.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 0
strip = true
panic = "abort"
debug-assertions = false
incremental = false
overflow-checks = false

[profile.release.package."*"]
opt-level = "z"
strip = true
debug-assertions = false
incremental = false
overflow-checks = false

[build-dependencies]
# upx binary compression will be handled manually
