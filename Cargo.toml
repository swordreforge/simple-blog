[package]
name = "dynamic-route-actix"
version = "0.1.0"
edition = "2021"
description = "A dynamic routing library for Actix-Web with database support, versioning, and validation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/dynamic-route-actix"
keywords = ["actix", "routing", "dynamic", "web", "database"]
categories = ["web-programming", "asynchronous", "database"]

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "chrono"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
notify = "7"
futures-util = "0.3"
regex = "1.10"
lru = "0.12"
object-pool = "0.5"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
rand = "0.8"

[features]
default = []
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
database = ["sqlite", "postgres", "chrono", "sqlx"]