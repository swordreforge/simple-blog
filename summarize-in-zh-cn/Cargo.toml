[package]
name = "rustblog-wip-for-summarize-in-zh-cn"
version = "0.1.0"
edition = "2024"
authors = ["Swordreforge <zhujian_20060818@qq.com>"]
description = "A Chinese text summarization library using TextRank algorithm"
