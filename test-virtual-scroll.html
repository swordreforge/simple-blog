<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟滚动测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #2a2a2a;
            border-radius: 8px;
        }
        .test-section h2 {
            margin-top: 0;
            color: #007bff;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background-color: #333;
            border-radius: 4px;
            font-family: monospace;
        }
        .success {
            color: #28a745;
        }
        .error {
            color: #dc3545;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #virtualScrollContainer {
            width: 100%;
            height: 400px;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>虚拟滚动功能测试</h1>

        <div class="test-section">
            <h2>测试 1: 脚本加载</h2>
            <button onclick="testScriptLoad()">测试脚本加载</button>
            <div id="scriptLoadResult" class="result">等待测试...</div>
        </div>

        <div class="test-section">
            <h2>测试 2: VirtualScroll 类实例化</h2>
            <button onclick="testVirtualScrollClass()">测试类实例化</button>
            <div id="virtualScrollClassResult" class="result">等待测试...</div>
        </div>

        <div class="test-section">
            <h2>测试 3: SidebarVirtualScroll 类实例化</h2>
            <button onclick="testSidebarVirtualScrollClass()">测试 SidebarVirtualScroll 类</button>
            <div id="sidebarVirtualScrollClassResult" class="result">等待测试...</div>
        </div>

        <div class="test-section">
            <h2>测试 4: 虚拟滚动渲染</h2>
            <button onclick="testVirtualScrollRender()">测试虚拟滚动渲染</button>
            <div id="virtualScrollContainer"></div>
            <div id="virtualScrollRenderResult" class="result">等待测试...</div>
        </div>
    </div>

    <script src="/js/virtual-scroll.js"></script>
    <script>
        let virtualScrollInstance = null;

        function testScriptLoad() {
            const resultDiv = document.getElementById('scriptLoadResult');
            try {
                if (typeof VirtualScroll !== 'undefined' && typeof SidebarVirtualScroll !== 'undefined') {
                    resultDiv.innerHTML = '<span class="success">✓ 脚本加载成功</span>';
                } else {
                    resultDiv.innerHTML = '<span class="error">✗ 脚本加载失败</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">✗ 脚本加载错误: ' + error.message + '</span>';
            }
        }

        function testVirtualScrollClass() {
            const resultDiv = document.getElementById('virtualScrollClassResult');
            try {
                const container = document.createElement('div');
                const vs = new VirtualScroll({
                    container: container,
                    itemHeight: 40,
                    onRenderItem: (element, item, index) => {
                        element.textContent = `Item ${index}: ${item.name}`;
                    }
                });
                resultDiv.innerHTML = '<span class="success">✓ VirtualScroll 类实例化成功</span>';
                vs.destroy();
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">✗ VirtualScroll 类实例化失败: ' + error.message + '</span>';
            }
        }

        function testSidebarVirtualScrollClass() {
            const resultDiv = document.getElementById('sidebarVirtualScrollClassResult');
            try {
                const container = document.createElement('div');
                const svs = new SidebarVirtualScroll({
                    container: container,
                    itemHeight: 42,
                    folders: [
                        {
                            id: 'folder1',
                            name: '测试文件夹',
                            open: true,
                            files: [
                                { id: 'file1', title: '测试文件1', date: '2024-01-01', status: 'published' },
                                { id: 'file2', title: '测试文件2', date: '2024-01-02', status: 'published' }
                            ]
                        }
                    ],
                    onFileClick: (file) => {
                        console.log('File clicked:', file);
                    }
                });
                resultDiv.innerHTML = '<span class="success">✓ SidebarVirtualScroll 类实例化成功</span>';
                svs.destroy();
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">✗ SidebarVirtualScroll 类实例化失败: ' + error.message + '</span>';
            }
        }

        function testVirtualScrollRender() {
            const resultDiv = document.getElementById('virtualScrollRenderResult');
            const container = document.getElementById('virtualScrollContainer');

            try {
                // 生成测试数据
                const testItems = [];
                for (let i = 0; i < 1000; i++) {
                    testItems.push({ name: `Test Item ${i}`, value: i });
                }

                // 创建虚拟滚动实例
                if (virtualScrollInstance) {
                    virtualScrollInstance.destroy();
                }

                virtualScrollInstance = new VirtualScroll({
                    container: container,
                    itemHeight: 40,
                    bufferSize: 5,
                    onRenderItem: (element, item, index) => {
                        element.textContent = `Item ${index}: ${item.name}`;
                        element.style.padding = '10px';
                        element.style.borderBottom = '1px solid #333';
                        element.style.cursor = 'pointer';
                    }
                });

                virtualScrollInstance.setItems(testItems);

                resultDiv.innerHTML = '<span class="success">✓ 虚拟滚动渲染成功，共 ' + testItems.length + ' 项</span>';
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">✗ 虚拟滚动渲染失败: ' + error.message + '</span>';
            }
        }
    </script>
</body>
</html>
