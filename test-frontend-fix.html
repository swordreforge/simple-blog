<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>测试前端修复</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    .info { color: blue; }
  </style>
</head>
<body>
  <h1>测试前端修复</h1>
  <div id="results"></div>

  <script>
    const results = document.getElementById('results');

    function addResult(type, message) {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = message;
      results.appendChild(div);
    }

    async function testAPI() {
      try {
        const response = await fetch('/api/passages?limit=2');
        const result = await response.json();

        if (result.success && result.data) {
          addResult('success', `API 正常返回 ${result.data.length} 篇文章`);
          addResult('info', `第一篇: ${result.data[0].title}`);
          addResult('info', `第二篇: ${result.data[1].title}`);
        } else {
          addResult('error', 'API 返回错误');
        }
      } catch (error) {
        addResult('error', `API 请求失败: ${error.message}`);
      }
    }

    async function testWorker() {
      try {
        const worker = new Worker('/js/sidebar-worker.js?v=' + Date.now());

        worker.addEventListener('message', function(e) {
          if (e.data.type === 'buildFolders' && e.data.success) {
            if (e.data.data && e.data.data.length > 0) {
              addResult('success', `Worker 正常构建了 ${e.data.data.length} 个文件夹`);
              addResult('info', `第一个文件夹: ${e.data.data[0].name}`);
            } else {
              addResult('error', 'Worker 返回了空的文件夹列表');
            }
          }
        });

        worker.postMessage({
          type: 'buildFolders',
          data: {
            articles: [
              { id: 1, title: 'Test 1', created_at: '2026-02-01 00:00:00' },
              { id: 2, title: 'Test 2', created_at: '2026-02-02 00:00:00' }
            ]
          }
        });

        addResult('info', 'Worker 测试已发送');
      } catch (error) {
        addResult('error', `Worker 测试失败: ${error.message}`);
      }
    }

    async function testVirtualScroll() {
      try {
        // 检查虚拟滚动脚本是否加载
        const response = await fetch('/js/virtual-scroll.js?v=20240213');
        if (response.ok) {
          const content = await response.text();
          if (content.includes('class VirtualScroll') && content.includes('class SidebarVirtualScroll')) {
            addResult('success', '虚拟滚动脚本正确加载');
          } else {
            addResult('error', '虚拟滚动脚本内容不正确');
          }
        } else {
          addResult('error', '虚拟滚动脚本加载失败');
        }
      } catch (error) {
        addResult('error', `虚拟滚动测试失败: ${error.message}`);
      }
    }

    // 运行测试
    testAPI();
    testWorker();
    testVirtualScroll();
  </script>
</body>
</html>
