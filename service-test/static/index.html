<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态路由管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景动画容器 */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        /* 浮动形状基础样式 */
        .shape {
            position: absolute;
            opacity: 0.6;
            animation: float linear infinite;
        }

        /* 圆形 */
        .circle {
            border-radius: 50%;
        }

        /* 三角形 */
        .triangle {
            width: 0;
            height: 0;
            border-left: calc(var(--size) / 2) solid transparent;
            border-right: calc(var(--size) / 2) solid transparent;
            border-bottom: var(--size) solid var(--color);
            background: transparent !important;
        }

        /* 正方形 */
        .square {
            border-radius: 2px;
        }

        /* 五角星 */
        .star {
            width: 0;
            height: 0;
            position: relative;
            background: transparent !important;
        }

        .star:before,
        .star:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: calc(var(--size) / 2) solid transparent;
            border-right: calc(var(--size) / 2) solid transparent;
            border-bottom: calc(var(--size) * 0.7) solid var(--color);
        }

        .star:before {
            transform: rotate(70deg);
        }

        .star:after {
            transform: rotate(-70deg);
            transform-origin: center calc(var(--size) * 0.7);
        }

        /* 浮动动画 */
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #ffffff;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .panel-title {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        h2, h3, h4, h5, h6 {
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #6c757d;
        }

        button.danger {
            background: #dc3545;
        }

        button.success {
            background: #28a745;
        }

        .route-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .route-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        .route-item:hover {
            background: rgba(0, 0, 0, 0.6);
        }

        .route-path {
            font-weight: 500;
            color: #ffffff;
            font-size: 14px;
        }

        .route-methods {
            color: #ffffff;
            font-size: 12px;
            margin-top: 3px;
        }

        .route-actions {
            display: flex;
            gap: 8px;
        }

        .route-actions button {
            padding: 6px 12px;
            font-size: 12px;
            margin: 0;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .demo-routes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .demo-route-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .demo-route-name {
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .demo-route-path {
            font-family: 'Courier New', monospace;
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .demo-route-desc {
            font-size: 12px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .demo-route-method {
            font-size: 11px;
            color: #667eea;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #ffffff;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #ffffff;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="background-animation" id="backgroundAnimation"></div>
    <div class="container">
        <header>
            <h1>🚀 动态路由管理系统</h1>
            <p class="subtitle">基于 Rust 和 Actix-Web 的高性能动态路由库验证平台</p>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="routeCount">0</div>
                    <div class="stat-label">活跃路由</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">5</div>
                    <div class="stat-label">支持的HTTP方法</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">∞</div>
                    <div class="stat-label">动态扩展</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">实时更新</div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <!-- 左侧：添加路由 -->
            <div class="panel">
                <h2 class="panel-title">➕ 添加新路由</h2>
                <div id="message"></div>
                <form id="addRouteForm">
                    <div class="form-group">
                        <label for="routePath">路由路径 *</label>
                        <input type="text" id="routePath" placeholder="/api/example" required>
                    </div>
                    <div class="form-group">
                        <label for="routeBody">响应内容 *</label>
                        <textarea id="routeBody" placeholder='{"status":"ok"}' required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="contentType">内容类型 *</label>
                        <select id="contentType" required>
                            <option value="text/plain">text/plain</option>
                            <option value="text/html">text/html</option>
                            <option value="application/json" selected>application/json</option>
                            <option value="application/xml">application/xml</option>
                        </select>
                    </div>
                    <button type="submit">添加路由</button>
                    <button type="button" class="secondary" onclick="clearForm()">清空表单</button>
                </form>

                <div style="margin-top: 30px;">
                    <h3 style="color: #333; font-size: 16px; margin-bottom: 15px;">⚡ 快速操作</h3>
                    <button onclick="addDemoRoutes()" class="success">添加演示路由</button>
                    <button onclick="clearAllRoutes()" class="danger">清空所有路由</button>
                    <button onclick="loadRoutes()" class="secondary">刷新列表</button>
                </div>
            </div>

            <!-- 右侧：路由列表 -->
            <div class="panel">
                <h2 class="panel-title">📋 路由列表</h2>
                <div id="routeList" class="route-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 演示路由区域 -->
        <div class="panel">
            <h2 class="panel-title">🎯 预设演示路由</h2>
            <p style="color: #666; margin-bottom: 20px; font-size: 14px;">点击下方的卡片可以快速添加预设的演示路由</p>
            <div id="demoRoutes" class="demo-routes">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <!-- API 测试区域 -->
        <div class="panel" style="margin-top: 20px;">
            <h2 class="panel-title">🧪 API 测试</h2>
            <p style="color: #666; margin-bottom: 15px; font-size: 14px;">在浏览器中直接访问以下路径来测试路由功能：</p>
            <div class="demo-routes" id="testLinks">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        // 显示消息
        function showMessage(message, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 3000);
        }

        // 加载路由列表
        async function loadRoutes() {
            try {
                const response = await fetch(`${API_BASE}/admin/routes`);
                const routes = await response.json();

                const routeListDiv = document.getElementById('routeList');
                document.getElementById('routeCount').textContent = routes.length;

                if (routes.length === 0) {
                    routeListDiv.innerHTML = '<div class="empty">暂无路由</div>';
                    return;
                }

                routeListDiv.innerHTML = routes.map(route => `
                    <div class="route-item">
                        <div>
                            <div class="route-path">${escapeHtml(route)}</div>
                            <div class="route-methods">GET, POST, PUT, DELETE, PATCH</div>
                        </div>
                        <div class="route-actions">
                            <button class="view-route-btn" data-path="${encodeURIComponent(route)}" class="secondary">查看</button>
                            <button class="delete-route-btn" data-path="${encodeURIComponent(route)}" class="danger">删除</button>
                            <button class="test-route-btn" data-path="${encodeURIComponent(route)}" class="success">测试</button>
                        </div>
                    </div>
                `).join('');

                // 为新添加的按钮绑定事件
                document.querySelectorAll('.view-route-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        viewRoute(decodeURIComponent(this.dataset.path));
                    });
                });
                document.querySelectorAll('.delete-route-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        deleteRoute(decodeURIComponent(this.dataset.path));
                    });
                });
                document.querySelectorAll('.test-route-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        testRoute(decodeURIComponent(this.dataset.path));
                    });
                });
            } catch (error) {
                console.error('加载路由失败:', error);
                showMessage('加载路由列表失败', 'error');
            }
        }

        // 添加路由
        async function addRoute(path, body, contentType) {
            try {
                const response = await fetch(`${API_BASE}/admin/routes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        path: path,
                        body: body,
                        content_type: contentType
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(`路由 ${path} 添加成功！`, 'success');
                    loadRoutes();
                    updateTestLinks();
                } else {
                    showMessage(`添加失败: ${result.error || '未知错误'}`, 'error');
                }
            } catch (error) {
                console.error('添加路由失败:', error);
                showMessage('添加路由失败', 'error');
            }
        }

        // 删除路由
        async function deleteRoute(path) {
            if (!confirm(`确定要删除路由 ${path} 吗？`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/routes${path}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage(`路由 ${path} 删除成功！`, 'success');
                    loadRoutes();
                    updateTestLinks();
                } else {
                    showMessage(`删除失败: ${result.error || '未知错误'}`, 'error');
                }
            } catch (error) {
                console.error('删除路由失败:', error);
                showMessage('删除路由失败', 'error');
            }
        }

        // 查看路由详情
        async function viewRoute(path) {
            try {
                const response = await fetch(`${API_BASE}/admin/routes${path}`);
                const result = await response.json();

                if (response.ok) {
                    const details = `
路径: ${result.path}
类型: ${result.route.route_type}
内容类型: ${result.route.content_type}
响应内容:
${result.route.body}
${result.route.extra_data ? `额外数据: ${result.route.extra_data}` : ''}
                    `;
                    alert(details);
                } else {
                    showMessage('获取路由详情失败', 'error');
                }
            } catch (error) {
                console.error('查看路由失败:', error);
                showMessage('查看路由失败', 'error');
            }
        }

        // 测试路由
        function testRoute(path) {
            window.open(path, '_blank');
        }

        // 添加演示路由
        async function addDemoRoutes() {
            try {
                const response = await fetch(`${API_BASE}/demo/add-all`, {
                    method: 'POST'
                });
                const result = await response.json();

                if (response.ok) {
                    showMessage(result.message, 'success');
                    loadRoutes();
                    updateTestLinks();
                } else {
                    showMessage('添加演示路由失败', 'error');
                }
            } catch (error) {
                console.error('添加演示路由失败:', error);
                showMessage('添加演示路由失败', 'error');
            }
        }

        // 清空所有路由
        async function clearAllRoutes() {
            if (!confirm('确定要清空所有路由吗？此操作不可撤销！')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/demo/clear`, {
                    method: 'POST'
                });
                const result = await response.json();

                if (response.ok) {
                    showMessage(result.message, 'success');
                    loadRoutes();
                    updateTestLinks();
                } else {
                    showMessage('清空路由失败', 'error');
                }
            } catch (error) {
                console.error('清空路由失败:', error);
                showMessage('清空路由失败', 'error');
            }
        }

        // 加载演示路由列表
        async function loadDemoRoutes() {
            try {
                const response = await fetch(`${API_BASE}/demo/routes`);
                const routes = await response.json();

                const demoRoutesDiv = document.getElementById('demoRoutes');
                demoRoutesDiv.innerHTML = routes.map(route => `
                    <div class="demo-route-card">
                        <div class="demo-route-name">${escapeHtml(route.name)}</div>
                        <div class="demo-route-path">${escapeHtml(route.path)}</div>
                        <div class="demo-route-desc">${escapeHtml(route.description)}</div>
                        <div class="demo-route-method">支持方法: ${escapeHtml(route.method)}</div>
                        <button class="add-demo-route-btn" data-path="${encodeURIComponent(route.path)}" data-content-type="${encodeURIComponent(getDemoRouteContentType(route.path))}" style="margin-top: 10px; width: 100%;">添加此路由</button>
                    </div>
                `).join('');

                // 为新添加的按钮绑定事件
                document.querySelectorAll('.add-demo-route-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const path = decodeURIComponent(this.dataset.path);
                        const contentType = decodeURIComponent(this.dataset.contentType);
                        const body = getDemoRouteBody(path);
                        addRoute(path, body, contentType);
                    });
                });
            } catch (error) {
                console.error('加载演示路由失败:', error);
            }
        }

        // 获取演示路由的响应内容
        function getDemoRouteBody(path) {
            const demoBodies = {
                '/': '欢迎使用动态路由系统！<br><br>这是一个基于 Rust 和 Actix-Web 的高性能动态路由库。<br>所有路由都可以通过管理界面动态添加、修改和删除。',
                '/api/status': '{"status":"ok","version":"1.0.0","service":"dynamic-route-service"}',
                '/api/user': '{"id":1,"name":"张三","email":"zhangsan@example.com","role":"admin"}',
                '/api/products': '{"products":[{"id":1,"name":"产品A","price":99.99},{"id":2,"name":"产品B","price":149.99}]}',
                '/about': '<meta charset="utf-8"><h1>关于我们</h1><p>这是一个动态路由系统演示项目</p>'
            };
            return demoBodies[path] || 'Demo content';
        }

        // 获取演示路由的内容类型
        function getDemoRouteContentType(path) {
            return path === '/api/status' || path === '/api/user' || path === '/api/products'
                ? 'application/json'
                : 'text/html';
        }

        // 更新测试链接
        function updateTestLinks() {
            fetch(`${API_BASE}/admin/routes`)
                .then(response => response.json())
                .then(routes => {
                    const testLinksDiv = document.getElementById('testLinks');
                    if (routes.length === 0) {
                        testLinksDiv.innerHTML = '<div class="empty">暂无路由可测试</div>';
                        return;
                    }
                    testLinksDiv.innerHTML = routes.map(route => `
                        <div class="demo-route-card">
                            <div class="demo-route-path">${escapeHtml(route)}</div>
                            <div class="demo-route-desc">点击测试</div>
                            <button class="test-link-btn" data-path="${encodeURIComponent(route)}" style="width: 100%;">在新窗口打开</button>
                        </div>
                    `).join('');

                    // 为新添加的按钮绑定事件
                    document.querySelectorAll('.test-link-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            testRoute(decodeURIComponent(this.dataset.path));
                        });
                    });
                })
                .catch(error => console.error('更新测试链接失败:', error));
        }

        // 清空表单
        function clearForm() {
            document.getElementById('addRouteForm').reset();
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 表单提交
        document.getElementById('addRouteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const path = document.getElementById('routePath').value;
            const body = document.getElementById('routeBody').value;
            const contentType = document.getElementById('contentType').value;

            addRoute(path, body, contentType);
            clearForm();
        });

        // 初始化
        window.addEventListener('load', function() {
            loadRoutes();
            loadDemoRoutes();
            updateTestLinks();
            initBackgroundAnimation();
        });

        // 初始化背景动画
        function initBackgroundAnimation() {
            const container = document.getElementById('backgroundAnimation');
            const colors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
                '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9',
                '#F8B500', '#FF6F61', '#6B5B95', '#88B04B', '#F7CAC9'
            ];
            const shapeTypes = ['circle', 'triangle', 'square', 'star'];
            const numShapes = 50;

            for (let i = 0; i < numShapes; i++) {
                createShape(container, colors, shapeTypes, i);
            }
        }

        // 创建单个形状
        function createShape(container, colors, shapeTypes, index) {
            const shape = document.createElement('div');
            const shapeType = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const size = Math.random() * 30 + 10;
            const left = Math.random() * 100;
            const duration = Math.random() * 15 + 10;

            // 将形状随机分布在屏幕的不同高度上
            const initialTop = Math.random() * (window.innerHeight + 200) - 200;

            shape.classList.add('shape', shapeType);
            shape.style.setProperty('--size', size + 'px');
            shape.style.setProperty('--color', color);
            shape.style.left = left + '%';
            shape.style.top = initialTop + 'px';
            shape.style.animationDuration = duration + 's';
            shape.style.animationDelay = '-' + (Math.random() * duration) + 's'; // 负延迟让动画已经进行了一段时间

            if (shapeType !== 'triangle' && shapeType !== 'star') {
                shape.style.width = size + 'px';
                shape.style.height = size + 'px';
                shape.style.backgroundColor = color;
            }

            container.appendChild(shape);
        }
    </script>
</body>
</html>
