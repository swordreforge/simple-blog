<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关于 - 随机图床</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background-color:ivory;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;min-height:100vh;overflow-x:hidden;position:relative}.navbar{position:fixed;top:0;left:0;right:0;background:rgba(255,255,240,.95);backdrop-filter:blur(10px);padding:1rem 2rem;display:flex;justify-content:center;gap:2rem;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.1)}.nav-link{text-decoration:none;color:#333;font-size:1rem;font-weight:500;padding:.5rem 1.5rem;border-radius:20px;transition:.3s;background:#fff;border:1px solid #ddd}.nav-link:hover{background:#4a90d9;color:#fff;border-color:#4a90d9;transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,144,217,.3)}#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}.particle{position:absolute;border-radius:50%;animation:15s ease-in-out infinite float;opacity:.7}@keyframes float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(100px,-50px) scale(1.1)}50%{transform:translate(-50px,100px) scale(.9)}75%{transform:translate(-100px,-100px) scale(1.05)}}.content{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:100px 2rem 2rem;z-index:1;position:relative}.about-card{background:#fff;padding:3rem;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.1);max-width:600px;width:100%;text-align:center}.about-card h1{color:#333;font-size:2.5rem;margin-bottom:1.5rem}.about-card .section{margin-bottom:2rem}.about-card h2{color:#4a90d9;font-size:1.3rem;margin-bottom:1rem}.about-card p{color:#666;line-height:1.8;font-size:1.05rem}.about-card a{color:#4a90d9;text-decoration:none;font-weight:500;transition:color .3s}.about-card a:hover{color:#2d6cb5;text-decoration:underline}@media (max-width:768px){.navbar{flex-direction:column;gap:.5rem;padding:.5rem}.nav-link{font-size:.9rem;padding:.4rem 1rem}.content{padding:140px 1rem 2rem}.about-card{padding:2rem}.about-card h1{font-size:2rem}.about-card h2{font-size:1.1rem}.about-card p{font-size:.95rem}}</style></head><body><nav class="navbar"><a href="/" class="nav-link">🏠 首页</a> <a href="/img/pc" class="nav-link">🖥️ PC 端壁纸</a> <a href="/img/mo" class="nav-link">📱 移动端壁纸</a> <a href="/admin" class="nav-link">⚙️ 管理面板</a></nav><div id="particles"></div><div class="content"><div class="about-card"><h1>ℹ️ 关于项目</h1><div class="section"><h2>项目介绍</h2><p>这是一个基于 ElysiaJS + Bun + TypeScript + SQLite 构建的随机图床服务，为 PC 端和移动端提供高质量的随机壁纸。</p></div><div class="section"><h2>技术栈</h2><p>后端框架: ElysiaJS<br>运行时: Bun<br>语言: TypeScript<br>数据库: SQLite<br>图像格式: WebP</p></div><div class="section"><h2>功能特性</h2><p>- 随机获取 PC/移动端壁纸<br>- 支持按标签筛选<br>- 管理员上传与管理<br>- 自动格式转换与压缩<br>- 响应式设计</p></div><div class="section"><h2>项目地址</h2><p>GitHub: <a href="https://github.com" target="_blank">@GitHub</a></p></div><div class="section"><h2>开发者</h2><p>作者: <a href="https://github.com" target="_blank">@GitHub</a></p></div></div></div><script>function createParticles(){const t=document.getElementById("particles"),a=["#FF6B6B","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#DDA0DD","#98D8C8","#F7DC6F","#BB8FCE","#85C1E9","#F8B500","#00CED1"];for(let e=0;e<15;e++){const e=document.createElement("div");e.className="particle";const n=80*Math.random()+20,l=a[Math.floor(Math.random()*a.length)];e.style.width=n+"px",e.style.height=n+"px",e.style.background=`radial-gradient(circle at 30% 30%, ${l} 0%, ${l}88 50%, ${l}44 100%)`,e.style.left=100*Math.random()+"%",e.style.top=100*Math.random()+"%",e.style.animationDelay=10*Math.random()+"s",e.style.animationDuration=10*Math.random()+10+"s",t.appendChild(e)}}createParticles()</script></body></html>
