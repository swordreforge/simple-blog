<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机图床</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background-color:ivory;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;min-height:100vh;overflow:hidden;position:relative;transition:background-color .3s}body.dark-mode{background-color:#1a1a2e}body.dark-mode .navbar{background:rgba(26,26,46,.95);box-shadow:0 2px 10px rgba(0,0,0,.3)}body.dark-mode .nav-link{background:#16213e;border-color:#0f3460;color:#e0e0e0}body.dark-mode .nav-link:hover{background:#0f3460;color:#e94560;border-color:#e94560}body.dark-mode .status-bar{background:#16213e;box-shadow:0 4px 20px rgba(0,0,0,.3)}body.dark-mode .status-bar h1{color:#e0e0e0}body.dark-mode .status-bar p{color:#a0a0a0}.theme-toggle{position:absolute;top:1rem;right:2rem;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:.3s;z-index:1001}.theme-toggle:hover{background:#f0f0f0;transform:scale(1.05)}body.dark-mode .theme-toggle{background:#16213e;border-color:#0f3460}body.dark-mode .theme-toggle:hover{background:#0f3460}.navbar{position:fixed;top:0;left:0;right:0;background:rgba(255,255,240,.95);backdrop-filter:blur(10px);padding:1rem 2rem;display:flex;justify-content:center;gap:2rem;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.1)}.nav-link{text-decoration:none;color:#333;font-size:1rem;font-weight:500;padding:.5rem 1.5rem;border-radius:20px;transition:.3s;background:#fff;border:1px solid #ddd}.nav-link:hover{background:#4a90d9;color:#fff;border-color:#4a90d9;transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,144,217,.3)}.content{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding-top:80px;z-index:1;position:relative}.status-bar{background:#fff;padding:2rem 3rem;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}.status-bar h1{color:#333;font-size:2.5rem;margin-bottom:1rem}.status-bar p{color:#666;font-size:1.1rem}#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}.particle{position:absolute;border-radius:50%;animation:15s ease-in-out infinite float;opacity:.7}@keyframes float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(100px,-50px) scale(1.1)}50%{transform:translate(-50px,100px) scale(.9)}75%{transform:translate(-100px,-100px) scale(1.05)}}@media (max-width:768px){.navbar{flex-direction:column;gap:.5rem;padding:.5rem}.nav-link{font-size:.9rem;padding:.4rem 1rem}.content{padding-top:120px}.status-bar{padding:1.5rem;margin:0 1rem}.status-bar h1{font-size:1.8rem}.status-bar p{font-size:1rem}}</style></head><body><nav class="navbar"><a href="/img/pc" class="nav-link">🖥️ PC 端壁纸</a> <a href="/img/mo" class="nav-link">📱 移动端壁纸</a> <a href="/admin" class="nav-link">⚙️ 管理面板</a> <a href="/about" class="nav-link">ℹ️ 关于</a> <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button></nav><div id="particles"></div><div class="content"><div class="status-bar"><h1>🎨 随机图床</h1><p>提供高质量的 PC 和移动端随机壁纸</p></div></div><script>function toggleTheme(){const t=document.body,e=document.querySelector(".theme-toggle");t.classList.toggle("dark-mode"),t.classList.contains("dark-mode")?(e.textContent="☀️",localStorage.setItem("theme","dark")):(e.textContent="🌙",localStorage.setItem("theme","light"))}function restoreTheme(){const t=localStorage.getItem("theme"),e=document.querySelector(".theme-toggle");"dark"===t&&(document.body.classList.add("dark-mode"),e&&(e.textContent="☀️"))}function createParticles(){const t=document.getElementById("particles"),e=["#FF6B6B","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#DDA0DD","#98D8C8","#F7DC6F","#BB8FCE","#85C1E9","#F8B500","#00CED1"];for(let o=0;o<15;o++){const o=document.createElement("div");o.className="particle";const a=80*Math.random()+20,n=e[Math.floor(Math.random()*e.length)];o.style.width=a+"px",o.style.height=a+"px",o.style.background=`radial-gradient(circle at 30% 30%, ${n} 0%, ${n}88 50%, ${n}44 100%)`,o.style.left=100*Math.random()+"%",o.style.top=100*Math.random()+"%",o.style.animationDelay=10*Math.random()+"s",o.style.animationDuration=10*Math.random()+10+"s",t.appendChild(o)}}restoreTheme(),createParticles()</script></body></html>
