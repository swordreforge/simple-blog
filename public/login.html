<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 - 随机图床</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background-color:ivory;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative;transition:background-color .3s}body.dark-mode{background-color:#1a1a2e}body.dark-mode .login-container{background:#16213e;box-shadow:0 10px 40px rgba(0,0,0,.5)}body.dark-mode .login-header h1{color:#e0e0e0}body.dark-mode .login-header p{color:#a0a0a0}body.dark-mode .form-group label{color:#e0e0e0}body.dark-mode .form-group input[type=password],body.dark-mode .form-group input[type=text]{background:#0f3460;border-color:#0f3460;color:#e0e0e0}body.dark-mode .form-group input[type=password]:focus,body.dark-mode .form-group input[type=text]:focus{border-color:#e94560}body.dark-mode .back-link a{color:#e94560}body.dark-mode .back-link a:hover{color:#ff6b81}.theme-toggle{position:absolute;top:1rem;right:1rem;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:.3s;z-index:1001}.theme-toggle:hover{background:#f0f0f0;transform:scale(1.05)}body.dark-mode .theme-toggle{background:#16213e;border-color:#0f3460}body.dark-mode .theme-toggle:hover{background:#0f3460}#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}.particle{position:absolute;border-radius:50%;animation:15s ease-in-out infinite float;opacity:.7}@keyframes float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(100px,-50px) scale(1.1)}50%{transform:translate(-50px,100px) scale(.9)}75%{transform:translate(-100px,-100px) scale(1.05)}}.login-container{background:#fff;padding:3rem;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.2);max-width:420px;width:90%;z-index:1;position:relative}.login-header{text-align:center;margin-bottom:2rem}.login-header h1{color:#2c3e50;font-size:2rem;margin-bottom:.5rem}.login-header p{color:#7f8c8d;font-size:.95rem}.form-group{margin-bottom:1.5rem}.form-group label{display:block;color:#34495e;font-weight:500;margin-bottom:.5rem}.form-group input[type=password],.form-group input[type=text]{width:100%;padding:.875rem;border:2px solid #e0e0e0;border-radius:8px;font-size:1rem;transition:border-color .3s}.form-group input[type=password]:focus,.form-group input[type=text]:focus{outline:0;border-color:#667eea}.btn{width:100%;padding:.875rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:.3s}.btn-primary{background:#4a90d9;color:#fff}.btn-primary:hover{background:#357abd;transform:translateY(-2px);box-shadow:0 5px 20px rgba(74,144,217,.4)}.btn-primary:active{transform:translateY(0)}.alert{padding:1rem;border-radius:8px;margin-bottom:1.5rem;display:none}.alert.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}.alert.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}.loading{display:none;text-align:center;color:#7f8c8d;margin-top:1rem}.loading.active{display:block}.spinner{display:inline-block;width:20px;height:20px;border:3px solid #f3f3f3;border-top:3px solid #4a90d9;border-radius:50%;animation:1s linear infinite spin;margin-right:.5rem;vertical-align:middle}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.back-link{text-align:center;margin-top:1.5rem}.back-link a{color:#4a90d9;text-decoration:none;font-weight:500}.back-link a:hover{color:#357abd;text-decoration:underline}.setup-badge{display:inline-block;background:#fff3cd;color:#856404;padding:.25rem .75rem;border-radius:12px;font-size:.85rem;font-weight:500;margin-bottom:1rem}</style></head><body><div id="particles"></div><button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button><div class="login-container"><div class="login-header"><h1 id="title">🔐 登录</h1><p id="subtitle">请输入您的管理员账户信息</p></div><div id="alert" class="alert"></div><form id="authForm"><div class="form-group"><label for="username">用户名</label> <input type="text" id="username" name="username" required placeholder="请输入用户名"></div><div class="form-group"><label for="password">密码</label> <input type="password" id="password" name="password" required placeholder="请输入密码（至少6位）"></div><button type="submit" class="btn btn-primary" id="submitBtn">登录</button></form><div class="loading" id="loading"><span class="spinner"></span> 处理中...</div><div class="back-link"><a href="/">← 返回首页</a></div></div><script>function toggleTheme(){const t=document.body,e=document.querySelector(".theme-toggle");t.classList.toggle("dark-mode"),t.classList.contains("dark-mode")?(e.textContent="☀️",localStorage.setItem("theme","dark")):(e.textContent="🌙",localStorage.setItem("theme","light"))}function restoreTheme(){const t=localStorage.getItem("theme"),e=document.querySelector(".theme-toggle");"dark"===t&&(document.body.classList.add("dark-mode"),e&&(e.textContent="☀️"))}function createParticles(){const t=document.getElementById("particles"),e=["#FF6B6B","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#DDA0DD","#98D8C8","#F7DC6F","#BB8FCE","#85C1E9","#F8B500","#00CED1"];for(let n=0;n<15;n++){const n=document.createElement("div");n.className="particle";const o=80*Math.random()+20,a=e[Math.floor(Math.random()*e.length)];n.style.width=o+"px",n.style.height=o+"px",n.style.background=`radial-gradient(circle at 30% 30%, ${a} 0%, ${a}88 50%, ${a}44 100%)`,n.style.left=100*Math.random()+"%",n.style.top=100*Math.random()+"%",n.style.animationDelay=10*Math.random()+"s",n.style.animationDuration=10*Math.random()+10+"s",t.appendChild(n)}}restoreTheme(),createParticles();let isInitMode=!1;async function checkInitStatus(){try{const t=await fetch("/api/admin/check-init");(await t.json()).needsInit&&(isInitMode=!0,document.getElementById("title").textContent="🚀 首次设置",document.getElementById("subtitle").textContent="创建您的管理员账户",document.getElementById("submitBtn").textContent="创建账户")}catch(t){console.error("Failed to check init status:",t)}}function showAlert(t,e="success"){const n=document.getElementById("alert");n.textContent=t,n.className=`alert ${e}`,n.style.display="block",setTimeout(()=>{n.style.display="none"},5e3)}function setLoading(t){const e=document.getElementById("loading"),n=document.getElementById("submitBtn");t?(e.classList.add("active"),n.disabled=!0,n.style.opacity="0.6"):(e.classList.remove("active"),n.disabled=!1,n.style.opacity="1")}document.getElementById("authForm").addEventListener("submit",async function(t){t.preventDefault();const e=document.getElementById("username").value.trim(),n=document.getElementById("password").value;if(n.length<6)showAlert("密码长度至少为 6 位","error");else{setLoading(!0);try{const t=isInitMode?"/api/admin/init":"/api/admin/login",o=await fetch(t,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:e,password:n})}),a=await o.json();a.success?(localStorage.setItem("admin_token",a.token),localStorage.setItem("admin_username",a.user.username),showAlert(isInitMode?"账户创建成功！正在跳转...":"登录成功！正在跳转...","success"),setTimeout(()=>{window.location.href="/admin"},1500)):showAlert(a.error||(isInitMode?"创建失败":"登录失败"),"error")}catch(t){showAlert("请求失败，请稍后重试","error")}finally{setLoading(!1)}}}),checkInitStatus()</script></body></html>
