[package]
name = "dynamic-route-service-test"
version = "0.1.0"
edition = "2021"

[dependencies]
dynamic-route-actix = { path = "..", features = ["database"] }
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-files = { version = "0.6", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }