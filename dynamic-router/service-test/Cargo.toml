[package]
name = "dynamic-route-service-test"
version = "0.1.0"
edition = "2021"

[dependencies]
dynamic-route-actix = { path = "..", features = ["database"] }
actix-web = "4"
actix-files = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }