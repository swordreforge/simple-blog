[package]
name = "dynamic-route-actix"
version = "0.1.0"
edition = "2024"
description = "A dynamic routing library for Actix-Web with database support, versioning, and validation"
license = "MIT"
repository = "https://github.com/yourusername/dynamic-route-actix"
keywords = ["actix", "routing", "dynamic", "web", "database"]
categories = ["web-programming", "asynchronous", "database"]

[dependencies]
actix-web = { version = "4.12.1", default-features = false, features = ["macros"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
async-trait = { version = "0.1", default-features = false }
thiserror = { version = "1", default-features = false }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"], optional = true }
notify = { version = "7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = { version = "1.10", default-features = false, features = ["std", "perf"] }
lru = { version = "0.12", default-features = false, features = ["hashbrown"] }
object-pool = { version = "0.5", default-features = false }
once_cell = { version = "1.19", default-features = false, features = ["std"] }
bytes = { version = "1.5", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
papaya = { version = "0.2", default-features = false }
seize = { version = "0.5", default-features = false, features = ["fast-barrier"] }
phf = { version = "0.11", default-features = false, features = ["std", "macros"] }
hashbrown = { version = "0.14", default-features = false }
ahash = { version = "0.8", default-features = false, features = ["std", "runtime-rng"] }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
rand = "0.8"

[features]
default = []
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
database = ["sqlite", "postgres", "chrono", "sqlx"]
simd = []  # SIMD优化特性，使用AVX2指令加速字符串操作
papaya = []  # 使用 Papaya 无锁哈希表优化路由查找性能
