<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 随机图床</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #FFFFF0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      transition: background-color 0.3s ease;
    }

    /* 暗色模式 */
    body.dark-mode {
      background-color: #1a1a2e;
    }

    body.dark-mode .login-container {
      background: #16213e;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    body.dark-mode .login-header h1 {
      color: #e0e0e0;
    }

    body.dark-mode .login-header p {
      color: #a0a0a0;
    }

    body.dark-mode .form-group label {
      color: #e0e0e0;
    }

    body.dark-mode .form-group input[type="text"],
    body.dark-mode .form-group input[type="password"] {
      background: #0f3460;
      border-color: #0f3460;
      color: #e0e0e0;
    }

    body.dark-mode .form-group input[type="text"]:focus,
    body.dark-mode .form-group input[type="password"]:focus {
      border-color: #e94560;
    }

    body.dark-mode .back-link a {
      color: #e94560;
    }

    body.dark-mode .back-link a:hover {
      color: #ff6b81;
    }

    /* 主题切换按钮 */
    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      border: 1px solid #ddd;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      z-index: 1001;
    }

    .theme-toggle:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }

    body.dark-mode .theme-toggle {
      background: #16213e;
      border-color: #0f3460;
    }

    body.dark-mode .theme-toggle:hover {
      background: #0f3460;
    }

    /* 粒子容器 */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 粒子样式 */
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float 15s infinite ease-in-out;
      opacity: 0.7;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      25% {
        transform: translate(100px, -50px) scale(1.1);
      }
      50% {
        transform: translate(-50px, 100px) scale(0.9);
      }
      75% {
        transform: translate(-100px, -100px) scale(1.05);
      }
    }

    .login-container {
      background: white;
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 420px;
      width: 90%;
      z-index: 1;
      position: relative;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      color: #2c3e50;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: #7f8c8d;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: #34495e;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 0.875rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    .form-group input[type="text"]:focus,
    .form-group input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #4a90d9;
      color: white;
    }

    .btn-primary:hover {
      background: #357abd;
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(74, 144, 217, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
    }

    .alert.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .loading {
      display: none;
      text-align: center;
      color: #7f8c8d;
      margin-top: 1rem;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #4a90d9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }

    .back-link a {
      color: #4a90d9;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link a:hover {
      color: #357abd;
      text-decoration: underline;
    }

    .setup-badge {
      display: inline-block;
      background: #fff3cd;
      color: #856404;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div id="particles"></div>
  <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button>

  <div class="login-container">
    <div class="login-header">
      <h1 id="title">🔐 登录</h1>
      <p id="subtitle">请输入您的管理员账户信息</p>
    </div>

    <div id="alert" class="alert"></div>

    <form id="authForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required placeholder="请输入用户名">
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required placeholder="请输入密码（至少6位）">
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">登录</button>
    </form>

    <div class="loading" id="loading">
      <span class="spinner"></span>
      处理中...
    </div>

    <div class="back-link">
      <a href="/">← 返回首页</a>
    </div>
  </div>

  <script>
    // 主题切换
    function toggleTheme() {
      const body = document.body;
      const themeToggle = document.querySelector('.theme-toggle');
      
      body.classList.toggle('dark-mode');
      
      if (body.classList.contains('dark-mode')) {
        themeToggle.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
      } else {
        themeToggle.textContent = '🌙';
        localStorage.setItem('theme', 'light');
      }
    }

    // 页面加载时恢复主题
    function restoreTheme() {
      const savedTheme = localStorage.getItem('theme');
      const themeToggle = document.querySelector('.theme-toggle');
      
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        if (themeToggle) themeToggle.textContent = '☀️';
      }
    }

    // 页面加载时恢复主题
    restoreTheme();

    // 生成随机粒子
    function createParticles() {
      const container = document.getElementById('particles');
      const colors = [
        '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', 
        '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F',
        '#BB8FCE', '#85C1E9', '#F8B500', '#00CED1'
      ];
      
      const particleCount = 15;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const size = Math.random() * 80 + 20;
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.background = `radial-gradient(circle at 30% 30%, ${color} 0%, ${color}88 50%, ${color}44 100%)`;
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 10 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
        
        container.appendChild(particle);
      }
    }

    // 页面加载时创建粒子
    createParticles();

    let isInitMode = false;

    // 检查是否需要初始化
    async function checkInitStatus() {
      try {
        const response = await fetch('/api/admin/check-init');
        const data = await response.json();

        if (data.needsInit) {
          isInitMode = true;
          document.getElementById('title').textContent = '🚀 首次设置';
          document.getElementById('subtitle').textContent = '创建您的管理员账户';
          document.getElementById('submitBtn').textContent = '创建账户';
        }
      } catch (error) {
        console.error('Failed to check init status:', error);
      }
    }

    // 显示提示信息
    function showAlert(message, type = 'success') {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert ${type}`;
      alert.style.display = 'block';
      setTimeout(() => {
        alert.style.display = 'none';
      }, 5000);
    }

    // 显示/隐藏加载状态
    function setLoading(loading) {
      const loadingEl = document.getElementById('loading');
      const submitBtn = document.getElementById('submitBtn');

      if (loading) {
        loadingEl.classList.add('active');
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.6';
      } else {
        loadingEl.classList.remove('active');
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    }

    // 表单提交
    document.getElementById('authForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (password.length < 6) {
        showAlert('密码长度至少为 6 位', 'error');
        return;
      }

      setLoading(true);

      try {
        const endpoint = isInitMode ? '/api/admin/init' : '/api/admin/login';
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
          // 保存 token
          localStorage.setItem('admin_token', result.token);
          localStorage.setItem('admin_username', result.user.username);

          showAlert(isInitMode ? '账户创建成功！正在跳转...' : '登录成功！正在跳转...', 'success');

          setTimeout(() => {
            window.location.href = '/admin';
          }, 1500);
        } else {
          showAlert(result.error || (isInitMode ? '创建失败' : '登录失败'), 'error');
        }
      } catch (error) {
        showAlert('请求失败，请稍后重试', 'error');
      } finally {
        setLoading(false);
      }
    });

    // 页面加载时检查初始化状态
    checkInitStatus();
  </script>
</body>
</html>
