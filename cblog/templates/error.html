<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{status}} - {{message}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid #007bff; padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: #007bff; }
        nav a { color: #007bff; text-decoration: none; margin-right: 15px; }
        nav a:hover { text-decoration: underline; }

        .error-page { text-align: center; padding: 40px 20px; }
        .error-code { font-size: 120px; font-weight: bold; color: #007bff; margin-bottom: 20px; line-height: 1; }
        .error-message { font-size: 32px; color: #333; margin-bottom: 15px; font-weight: 600; }
        .error-description { color: #666; margin-bottom: 30px; line-height: 1.8; }
        .error-description strong { color: #007bff; }

        .back-link {
            display: inline-block;
            padding: 10px 25px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-link:hover { background: #0056b3; text-decoration: none; }

        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee;
                 text-align: center; color: #666; }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .error-code { font-size: 80px; }
            .error-message { font-size: 24px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>RustBlog</h1>
        <nav>
            <a href="/">首页</a> |
            <a href="/archive">归档</a> |
            <a href="/about">关于</a> |
            <a href="/friends">友链</a>
        </nav>
    </header>

    <main>
        <div class="error-page">
            <div class="error-code">{{status}}</div>
            <div class="error-message">{{message}}</div>
            <div class="error-description">{{description}}</div>
            <a href="/" class="back-link">返回首页</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 RustBlog. Powered by RustBlog C.</p>
    </footer>
</body>
</html>
