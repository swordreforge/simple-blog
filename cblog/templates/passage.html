<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
               line-height: 1.8; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid #007bff; padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: #007bff; margin-bottom: 10px; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .content { line-height: 1.8; }
        .content h2 { margin-top: 30px; margin-bottom: 15px; }
        .content p { margin-bottom: 15px; }
        .content pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .content code { background: #f4f4f4; padding: 2px 5px; border-radius: 3px; }
        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; 
                 text-align: center; color: #666; }
    </style>
</head>
<body>
    <header>
        <h1>{{site_name}}</h1>
        <nav>
            <a href="/">首页</a> |
            <a href="/archive">归档</a> |
            <a href="/about">关于</a>
        </nav>
    </header>
    
    <main>
        <article>
            <h1>{{title}}</h1>
            <div class="meta">
                <span>作者: {{author}}</span> |
                <span>发布于: {{created_at}}</span> |
                <span>分类: {{category}}</span>
            </div>
            <div class="content">
                {{content}}
            </div>
        </article>
    </main>
    
    <footer>
        <p>&copy; {{year}} {{site_name}}. Powered by RustBlog C.</p>
    </footer>
</body>
</html>
