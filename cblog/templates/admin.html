<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - {{site_name}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .admin-container { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; }
        .sidebar h2 { margin-bottom: 30px; }
        .sidebar nav a { display: block; padding: 10px; color: #ecf0f1; text-decoration: none; 
                         margin-bottom: 5px; border-radius: 5px; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #34495e; }
        .main-content { flex: 1; padding: 20px; background: #ecf0f1; }
        .header { background: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .content { background: white; padding: 20px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-success { background: #28a745; color: white; }
    </style>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <h2>{{site_name}}</h2>
            <nav>
                <a href="/admin" class="active">文章管理</a>
                <a href="/admin/comments">评论管理</a>
                <a href="/admin/users">用户管理</a>
                <a href="/admin/settings">系统设置</a>
                <a href="/admin/music">音乐管理</a>
                <a href="/logout">退出登录</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <div class="header">
                <h1>管理后台</h1>
                <p>欢迎回来, {{username}}!</p>
            </div>
            
            <div class="content">
                {{content}}
            </div>
        </main>
    </div>
</body>
</html>
