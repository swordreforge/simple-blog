<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
               line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid #007bff; padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: #007bff; }
        .passage { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .passage h2 { color: #333; margin-bottom: 10px; }
        .passage .meta { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .passage .summary { color: #555; }
        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; 
                 text-align: center; color: #666; }
    </style>
</head>
<body>
    <header>
        <h1>{{site_name}}</h1>
        <nav>
            <a href="/">首页</a> |
            <a href="/archive">归档</a> |
            <a href="/about">关于</a> |
            <a href="/friends">友链</a>
        </nav>
    </header>
    
    <main>
        {{passages}}
    </main>
    
    <footer>
        <p>&copy; {{year}} {{site_name}}. Powered by RustBlog C.</p>
    </footer>
</body>
</html>
