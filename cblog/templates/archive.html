<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章归档 - {{site_name}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid #007bff; padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: #007bff; }
        h2 { color: #333; margin-bottom: 15px; }
        nav a { color: #007bff; text-decoration: none; margin-right: 15px; }
        nav a:hover { text-decoration: underline; }

        .archive-stats { background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .archive-stats strong { color: #007bff; }

        .passage-list { margin-bottom: 30px; }
        .passage { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px;
                  transition: box-shadow 0.3s; }
        .passage:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .passage h3 { color: #333; margin-bottom: 10px; }
        .passage h3 a { color: #007bff; text-decoration: none; }
        .passage h3 a:hover { text-decoration: underline; }
        .passage .meta { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .passage .summary { color: #555; line-height: 1.6; }
        .passage .tags { margin-top: 10px; }
        .passage .tags span {
            display: inline-block;
            background: #e9ecef;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            color: #495057;
            margin-right: 5px;
        }

        .pagination { text-align: center; margin: 30px 0; }
        .pagination a { color: #007bff; text-decoration: none; padding: 8px 15px; margin: 0 3px;
                       border: 1px solid #dee2e6; border-radius: 3px; }
        .pagination a:hover { background: #007bff; color: white; }
        .pagination .current { background: #007bff; color: white; padding: 8px 15px; margin: 0 3px;
                               border-radius: 3px; }
        .pagination .disabled { color: #6c757d; cursor: not-allowed; }

        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee;
                 text-align: center; color: #666; }
    </style>
</head>
<body>
    <header>
        <h1>{{site_name}}</h1>
        <nav>
            <a href="/">首页</a> |
            <a href="/archive">归档</a> |
            <a href="/about">关于</a> |
            <a href="/friends">友链</a>
        </nav>
    </header>

    <main>
        <h2>文章归档</h2>

        <div class="archive-stats">
            共 <strong>{{total}}</strong> 篇文章
        </div>

        <div class="passage-list">
            {{passages}}
        </div>

        <div class="pagination">
            {{pagination}}
        </div>
    </main>

    <footer>
        <p>&copy; {{year}} {{site_name}}. Powered by RustBlog C.</p>
    </footer>
</body>
</html>
